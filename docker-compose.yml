services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myai}
      POSTGRES_DB: ${POSTGRES_DB:-myai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  embedding:
    image: beloved70020/bge-m3:latest
    restart: unless-stopped
    ports:
      - "${EMBEDDING_PORT:-8006}:8080"

  # Cross-encoder reranker (improves RAG document precision).
  # First boot downloads the model (~600MB), so the host needs internet once;
  # the model is then cached in the named volume below across restarts.
  # bge-reranker-v2-m3 is multilingual (good for Persian). To use a smaller,
  # faster English-only model, change ONLY the --model-id below.
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.1
    restart: unless-stopped
    command: ["--model-id", "BAAI/bge-reranker-v2-m3"]
    environment:
      # Explicit base endpoint fixes TEI's "relative URL without a base" download error.
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - reranker_cache:/data
    ports:
      - "${RERANKER_PORT:-8007}:80"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-myai}:${POSTGRES_PASSWORD:-myai}@postgres:5432/${POSTGRES_DB:-myai}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-in-production-32bytes}
      DEFAULT_EMBEDDING_BASE_URL: http://embedding:8080/v1
      DEFAULT_EMBEDDING_API_TYPE: openai
      DEFAULT_EMBEDDING_MODEL: BAAI/bge-m3
      RERANKER_BASE_URL: http://reranker:80
      CORS_ORIGINS: '["*"]'
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: ["./entrypoint.sh"]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  postgres_data:
  reranker_cache:
