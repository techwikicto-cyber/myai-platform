server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    location /api/ {
        # Resolve the backend hostname per-request via Docker's embedded DNS instead of
        # caching its IP at startup. Without this, recreating the backend container (new
        # IP) leaves nginx pointing at the old IP → 502 "host is unreachable" until a
        # frontend restart. Using a variable in proxy_pass forces the re-resolution.
        resolver 127.0.0.11 valid=10s;
        set $backend_host backend;
        proxy_pass http://$backend_host:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
