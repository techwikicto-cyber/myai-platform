<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400">
  <g stroke="#35302A" stroke-width="4.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- ear tufts: outward arches, tips pointing down-out -->
    <path d="M52.5 12.5 C50 4, 40.5 2.5, 36 11.5" fill="none"/>
    <path d="M63.5 12.5 C66 4, 75.5 2.5, 80 11.5" fill="none"/>

    <!-- feet dome (under body) -->
    <path d="M41.5 96 A 13.5 10.5 0 0 1 68.5 96 Z" fill="#FFFFFF"/>

    <!-- body -->
    <path d="M47 39.5 L22.5 78.5 C33 86.5, 54 87.5, 63 82.5 C73.5 76, 77 56, 70.5 41 C62.5 44, 54 42.8, 47 39.5 Z" fill="#FFFFFF"/>

    <!-- wing (orange) -->
    <path d="M45.5 44 L24 76.5 C33.5 78.5, 44.5 73, 49.5 64.5 C54 56.5, 53 48.8, 48 44.8 Z" fill="#F5713B" stroke-width="3.8"/>

    <!-- shoulder swoosh (orange comma hooked from the neck) -->
    <path d="M51 42.7 C59.5 45.5, 63.5 52.5, 61.5 60 C60 65, 55.5 67.8, 51.8 67 C55.5 63, 57 57.5, 55.2 52.3 C53.5 47.5, 50 44.5, 46.5 43.4 Z" fill="#F5713B" stroke-width="3.4"/>

    <!-- head -->
    <circle cx="58" cy="29.5" r="16.5" fill="#FFFFFF"/>

    <!-- orange crown, dipping to a V between (not over) the eyes -->
    <path d="M45 21.5 Q58 9.5, 71 21.5 Q64.5 24, 60.5 29 Q58 32, 55.5 29 Q51.5 24, 45 21.5 Z" fill="#F5713B" stroke-width="3.4"/>

    <!-- beak -->
    <path d="M58 34 L58 39" stroke-width="3.6" fill="none"/>
  </g>

  <!-- wing white stripe -->
  <path d="M31 69.5 C38.5 67.5, 44 61, 46.8 53" stroke="#FFFFFF" stroke-width="3.6" fill="none" stroke-linecap="round"/>

  <!-- eyes -->
  <circle cx="51" cy="32" r="3" fill="#35302A"/>
  <circle cx="65" cy="32" r="3" fill="#35302A"/>
</svg>
